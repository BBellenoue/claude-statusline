name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned to a commit; the comment carries the tag Dependabot tracks.
jobs:
  check:
    name: Lint and render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck statusline.sh

      # Same input, same output; line 1 is skipped, it depends on the checkout folder.
      - name: Render
        run: |
          bash statusline.sh < test.json > sh.out
          pwsh -NoProfile -File statusline.ps1 < test.json > ps.out
          cat sh.out; echo; cat ps.out; echo
          diff <(tail -n +2 sh.out) <(tail -n +2 ps.out)
          grep -q '43%' sh.out && grep -q '7d' sh.out && [ "$(wc -l < sh.out)" -eq 3 ]

      - name: Bar colors
        run: |
          bar=$(printf '\033[38;2;63;185;122m◼◼◼◼◼◼\033[38;2;230;180;60m◼◼◼\033[38;2;229;83;75m◼\033[38;2;43;58;85m◼◼\033[0m')
          grep -qF "$bar" sh.out
          grep -qF "$bar" ps.out

      - name: Tests
        run: bash tests/run.sh

      - name: PSScriptAnalyzer
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          # Console.Write keeps stdout free of a trailing newline, like statusline.sh
          $findings = Invoke-ScriptAnalyzer -Path statusline.ps1 -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          $findings | Format-List RuleName, Severity, Line, Message
          if ($findings) { exit 1 }

      - name: Repository hooks are not run
        if: runner.os != 'Windows'
        run: |
          work=$(mktemp -d)
          mkdir "$work/repo"
          git init -q -b main "$work/repo"
          printf '#!/bin/sh\ntouch "%s/ran"\n' "$work" > "$work/hook.sh"
          chmod +x "$work/hook.sh"
          git -C "$work/repo" config core.fsmonitor "$work/hook.sh"
          printf '{"cwd":"%s/repo"}' "$work" | bash statusline.sh > /dev/null
          printf '{"cwd":"%s/repo"}' "$work" | pwsh -NoProfile -File statusline.ps1 > /dev/null
          test ! -e "$work/ran"

      - name: Branch before the first commit
        if: runner.os != 'Windows'
        run: |
          repo=$(mktemp -d)
          git init -q -b main "$repo"
          printf '{"cwd":"%s"}' "$repo" | bash statusline.sh | grep -q 'main'
          printf '{"cwd":"%s"}' "$repo" | pwsh -NoProfile -File statusline.ps1 | grep -q 'main'
